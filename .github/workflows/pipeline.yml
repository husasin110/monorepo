name: 'Enterprise Monorepo CI/CD'

on:
  push:
    branches: [ "main" ]
    tags: [ 'dev-*' ]
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Specify version to deploy (e.g. 1.0.4) or leave blank for auto-bump'
        required: false
        type: string

permissions:
  id-token: write
  contents: write
  pull-requests: read

jobs:
  detect:
    name: 'Detect Component Changes'
    runs-on: ubuntu-latest
    outputs:
      ui_changed: ${{ steps.filter.outputs.ui }}
      api_changed: ${{ steps.filter.outputs.api }}
      infra_changed: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_version != '' && format('refs/tags/dev-{0}', inputs.target_version) || github.ref }}

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ui:
              - 'ui/**'
            api:
              - 'api/**'
            infra:
              - 'infra/**'

  versioning:
    name: 'Manage Version via Azure Key Vault'
    needs: detect
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Determine or Bump Version
        id: bump
        shell: bash
        run: |
          INPUT_VERSION="${{ github.event.inputs.target_version }}"
          REF_NAME="${{ github.ref_name }}"
          REF_TYPE="${{ github.ref_type }}"

          if [ -n "$INPUT_VERSION" ]; then
            NEW_VERSION="$INPUT_VERSION"
            echo "Using manually provided version: $NEW_VERSION"
          elif [ "$REF_TYPE" = "tag" ]; then
            NEW_VERSION="${REF_NAME#dev-}"
            echo "Using version from pushed tag: $NEW_VERSION"
          else
            VAULT_NAME="${{ secrets.AZURE_KEYVAULT_NAME }}"
            SECRET_NAME="app-version"

            CURRENT_VERSION=$(az keyvault secret show --vault-name "$VAULT_NAME" --name "$SECRET_NAME" --query "value" -o tsv 2>/dev/null || echo "1.0.0")

            IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
            patch=$((patch + 1))
            NEW_VERSION="$major.$minor.$patch"

            echo "Current Version: $CURRENT_VERSION"
            echo "Bumped Version: $NEW_VERSION"

            az keyvault secret set --vault-name "$VAULT_NAME" --name "$SECRET_NAME" --value "$NEW_VERSION" > /dev/null
          fi

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

  infrastructure:
    name: 'Terraform Infrastructure'
    needs: [detect, versioning]
    runs-on: ubuntu-latest
    outputs:
      ui_app_name: ${{ steps.tf_outputs.outputs.ui_app_name }}
      api_app_name: ${{ steps.tf_outputs.outputs.api_app_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_version != '' && format('refs/tags/dev-{0}', inputs.target_version) || github.ref }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infra
        run: terraform init
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_app_version: ${{ needs.versioning.outputs.app_version }}

      - name: Get Terraform Outputs
        id: tf_outputs
        working-directory: infra
        shell: bash
        run: |
          UI_APP_NAME=$(terraform output -raw ui_app_name 2>/dev/null | xargs || echo "app-hussain-ui-unique-992")
          API_APP_NAME=$(terraform output -raw api_app_name 2>/dev/null | xargs || echo "app-hussain-api-unique-992")

          echo "ui_app_name<<EOF" >> $GITHUB_OUTPUT
          echo "$UI_APP_NAME" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "api_app_name<<EOF" >> $GITHUB_OUTPUT
          echo "$API_APP_NAME" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "UI App Service: '$UI_APP_NAME'"
          echo "API App Service: '$API_APP_NAME'"
          echo "Deployed Version: ${{ needs.versioning.outputs.app_version }}"

  build-ui:
    name: 'Prepare UI Artifact'
    needs: [detect, infrastructure, versioning]
    if: needs.detect.outputs.ui_changed == 'true' || needs.detect.outputs.infra_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_version != '' && format('refs/tags/dev-{0}', inputs.target_version) || github.ref }}

      - name: Upload UI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-build
          path: ui
          retention-days: 1

  build-api:
    name: 'Build & Test API'
    needs: [detect, infrastructure, versioning]
    if: needs.detect.outputs.api_changed == 'true' || needs.detect.outputs.infra_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_version != '' && format('refs/tags/dev-{0}', inputs.target_version) || github.ref }}

      - name: Setup Node.js / PHP Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Test
        working-directory: api
        run: |
          npm install || true
          npm test || echo "No tests configured"

      - name: Upload API Artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-build
          path: api
          retention-days: 1

  deploy-ui:
    name: 'Deploy UI to Azure'
    needs: [infrastructure, build-ui, versioning]
    runs-on: ubuntu-latest
    steps:
      - name: Download UI Artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-build
          path: ui-dist

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Deploy UI Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-hussain-ui-unique-992
          resource-group-name: rg-hussain-enterprise
          package: ui-dist

  deploy-api:
    name: 'Deploy API to Azure'
    needs: [infrastructure, build-api, versioning]
    runs-on: ubuntu-latest
    steps:
      - name: Download API Artifact
        uses: actions/download-artifact@v4
        with:
          name: api-build
          path: api

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Deploy API Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-hussain-api-unique-992
          resource-group-name: rg-hussain-enterprise
          package: api

  create-tag:
    name: 'Create Deployment Git Tag'
    needs: [versioning, infrastructure, deploy-ui, deploy-api]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.ref_type != 'tag' && github.event.inputs.target_version == ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and Push Tag
        env:
          VERSION: ${{ needs.versioning.outputs.app_version }}
        run: |
          TAG_NAME="dev-$VERSION"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git tag -a "$TAG_NAME" -m "Automated deployment tag for version $VERSION"
          git push origin "$TAG_NAME"
          echo "Successfully created and pushed tag: $TAG_NAME"